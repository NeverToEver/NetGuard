[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "0.1.0"
description = "NetGuard 跨平台网络数据包监控工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netguard.assets" = ["*.png", "*.svg", "*.icns"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

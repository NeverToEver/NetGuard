[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
description = "NetGuard 跨平台网络数据包监控工具（轻量 IDS）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luna" }]
keywords = ["network", "packet-capture", "pcap", "ids", "sniffer", "wireshark", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: System Administrators",
  # 不再写 "License :: OSI Approved :: MIT License"：license 已用 PEP 639 表达式
  # 声明，setuptools 会拒绝同时出现旧式 license 分类器
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NeverToEver/NetGuard"
Repository = "https://github.com/NeverToEver/NetGuard"
Issues = "https://github.com/NeverToEver/NetGuard/issues"
Changelog = "https://github.com/NeverToEver/NetGuard/blob/main/CHANGELOG.md"

[project.scripts]
netguard = "netguard.app:main"

[project.optional-dependencies]
# CI 用 `pip install -e ".[test]"` 安装，随后以 --cov 运行 pytest，
# 因此 pytest-cov 必须属于 test 组，否则 CI 会报 unrecognized arguments。
# pytest-timeout 是兜底：任何一个测试挂起都不该让 CI job 无限 in_progress。
test = ["pytest>=7.4", "pytest-cov>=5.0", "pytest-timeout>=2.3"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netguard" = ["py.typed"]
"netguard.assets" = ["*.png", "*.svg", "*.icns"]

[tool.setuptools.dynamic]
version = { attr = "netguard._version.__version__" }

# --- 代码检查与格式化 ---------------------------------------------------------
# 行宽取 120：现有代码写于 100–120 之间，沿用 ruff 默认的 88 会产生大量
# 无意义的纯格式改动，掩盖真实修复。
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-win", ".venv-build", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PIE",  # flake8-pie
  "RUF",  # ruff-specific
  "S110", # try-except-pass
  "S112", # try-except-continue
]
ignore = [
  "RUF001", # 中文全角标点在字符串/注释中属正常用法，会大面积误报
  "RUF002",
  "RUF003",
  "SIM108", # 三元表达式并非总是更清晰
]

[tool.ruff.lint.per-file-ignores]
# ctypes.Structure 子类必须沿用平台结构体原名（全大写）
"scripts/benchmark.py" = ["N801", "N817"]
# ctypes 结构体名沿用 C 定义（timeval / pcap_pkthdr 等），不按 PEP8 改名
"src/netguard/capture/pcap.py" = ["N801"]
# 测试与脚本中吞掉异常属有意为之（模拟、清理、并发收尾）
"tests/**" = ["S110", "S112"]
"scripts/**" = ["S110", "S112"]
# main_ui 的 TK_SILENCE_DEPRECATION 必须在 import tkinter 之前设置
"src/netguard/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["netguard"]

# --- 类型检查 ----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/netguard"]
strict = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
# 固定平台，使检查结论不随宿主系统变化。
# 背景：gui/theme.py 用 winreg 探测系统深浅色，该模块只存在于 Windows。
# mypy 默认按运行平台加载 typeshed，于是"Windows 本地通过、Linux CI 报
# attr-defined"——两边结论相反，本地验证无法预测 CI。这里显式固定为 win32；
# src/netguard 未使用任何 POSIX 专用模块，因此该固定不会掩盖真实问题。
# 改动前请先确认仍无 POSIX-only 依赖。
platform = "win32"

# Tkinter 控件属性为运行时动态挂载，strict 在此文件上收益低、噪声大。
# no-untyped-call 特指"调用未标注的函数"：typeshed 的 tkinter stub 至今未标注
# curselection / sashpos / nearest 等常用方法，此处放宽以免把这些上游缺口
# 变成项目自身的错误。核心模块仍保持 strict。
[[tool.mypy.overrides]]
module = "netguard.gui.main_ui"
disallow_untyped_defs = false
warn_return_any = false
disallow_untyped_calls = false

# --- 测试与覆盖率 ------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: 标记耗时较长的用例"]
# 全局超时兜底：Tk 在无头环境可能挂起（macOS 上不抛异常），届时让测试失败而不是
# 让整个 CI job 无限 in_progress。最慢的 GUI 用例含轮询，实测均在 3s 内。
timeout = 120

[tool.coverage.run]
source = ["netguard"]
branch = true

[tool.coverage.report]
# 基线约 63%（GUI 与平台相关分支难以单测）。门槛留 3 个点余量，
# 既能拦住覆盖率倒退，又不会因正常重构误伤。
fail_under = 60
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff check
        run: python -m ruff check src tests scripts main.py

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts main.py

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      - name: Mypy
        run: python -m mypy

  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Linux 用 Xvfb 提供虚拟显示，让 GUI 冒烟用例真正执行。
      # 否则无显示器时这些用例会跳过，main_ui.py（项目最大模块）几乎零覆盖，
      # 总覆盖率从约 61% 掉到约 50%，覆盖率门槛会无谓失败。
      - name: Run tests with coverage (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a python -m pytest tests/ -v
          --cov=netguard --cov-report=term-missing --cov-report=xml

      # Windows runner 有可用窗口系统，GUI 用例直接执行。
      - name: Run tests with coverage (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m pytest tests/ -v
          --cov=netguard --cov-report=term-missing --cov-report=xml

      # macOS runner 实测能创建 Tk 窗口（GUI 用例全部执行，264 passed）。
      # 这里刻意不设覆盖率门槛：该平台的职责是验证非 Windows/Linux 特有路径，
      # 而不是再施加一道平台相关的数字要求——覆盖率已由 Ubuntu 任务把关，
      # 两处重复要求只会让门槛随平台波动。
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest tests/ -v

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  benchmark:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # --fail-on-miss 让检出率与误报率成为门槛：脚本内已实现但此前 CI 未启用，
      # 等于检测质量无回归保护
      - name: Run benchmark gate
        run: python scripts/benchmark.py --packets 20000 --rules 50 --fail-on-miss
